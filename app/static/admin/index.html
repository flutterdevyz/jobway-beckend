<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobway | Admin Panel</title>
    <link rel="icon" type="image/png" href="/admin-ui/images/jobway.png">
    <link rel="stylesheet" href="/admin-ui/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>

<body>
    <!-- Login View -->
    <div id="login-view" class="login-overlay hidden">
        <div class="login-card">
            <div class="login-header">
                <h2>Jobway Admin Login</h2>
                <p>Enter your credentials to access the panel</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="login-phone" placeholder="+998901234567" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="primary-btn w-100">Login to Dashboard</button>
            </form>
            <p id="login-error" class="error-text hidden"></p>
        </div>
    </div>

    <div class="app-container" id="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-text">Jobway<span>Admin</span></span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="dashboard">
                    <i data-feather="grid"></i> <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-view="users">
                    <i data-feather="users"></i> <span>Users</span>
                </a>
                <a href="#" class="nav-item" data-view="jobs">
                    <i data-feather="briefcase"></i> <span>Jobs</span>
                </a>
                <a href="#" class="nav-item" data-view="categories">
                    <i data-feather="layers"></i> <span>Categories</span>
                </a>
                <a href="#" class="nav-item" data-view="applications">
                    <i data-feather="file-text"></i> <span>Applications</span>
                </a>
                <a href="#" class="nav-item" data-view="contact_requests">
                    <i data-feather="mail"></i> <span>Contact Requests</span>
                </a>
                <a href="#" class="nav-item" data-view="notifications">
                    <i data-feather="bell"></i> <span>Notifications</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn" class="logout-btn">
                    <i data-feather="log-out"></i> <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-nav">
                <div class="page-title">
                    <h1 id="view-title">Dashboard</h1>
                </div>
                <div class="user-profile">
                    <span id="admin-name">Admin</span>
                    <div class="avatar">A</div>
                </div>
            </header>

            <div id="content-area" class="content-fade-in">
                <!-- Content will be injected here -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-container" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Edit Item</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div id="modal-body" class="modal-body">
                <form id="modal-form">
                    <div id="form-fields"></div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/admin-ui/app.js"></script>
</body>

</html>
